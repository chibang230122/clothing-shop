<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Quản lý biến thể')}"></head>
<body class="bg-light">

<div th:replace="~{fragments/bootstrap-menu :: menu}"></div>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0"
                        th:text="${isEdit} ? 'Sửa biến thể sản phẩm' : 'Thêm biến thể sản phẩm'">
                        Quản lý biến thể
                    </h4>
                </div>

                <div class="card-body">
                    <p>
                        <strong>Sản phẩm:</strong>
                        <span th:text="${product.productName}"></span>
                    </p>

                    <div th:if="${error != null}" class="alert alert-danger"
                         th:text="${error}"></div>

                    <form th:action="${isEdit}
                          ? @{/admin/products/{productId}/variants/update(productId=${product.productId})}
                          : @{/admin/products/{productId}/variants/save(productId=${product.productId})}"
                          th:object="${variant}" method="post">

                        <input type="hidden" th:field="*{variantId}">

                        <div class="mb-3">
                            <label for="sku" class="form-label">Mã SKU</label>
                            <input type="text" id="sku" th:field="*{sku}"
                                   class="form-control" maxlength="50"
                                   placeholder="Ví dụ: AO001-M-DEN" required>
                        </div>

                        <div class="mb-3">
                            <label for="size" class="form-label">Size</label>
                            <select id="size" th:field="*{size}"
                                    class="form-select" required>
                                <option value="">-- Chọn size --</option>
                                <option value="S">S</option>
                                <option value="M">M</option>
                                <option value="L">L</option>
                                <option value="XL">XL</option>
                                <option value="XXL">XXL</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="color" class="form-label">Màu sắc</label>
                            <input type="text" id="color" th:field="*{color}"
                                   class="form-control" maxlength="40"
                                   placeholder="Ví dụ: Đen, Trắng, Xanh" required>
                        </div>

                        <div class="mb-3">
                            <label for="stockQuantity" class="form-label">
                                Số lượng tồn kho
                            </label>
                            <input type="number" id="stockQuantity"
                                   th:field="*{stockQuantity}"
                                   class="form-control" min="0" required>
                        </div>

                        <div class="form-check mb-3">
                            <input type="checkbox" id="isActive"
                                   th:field="*{isActive}"
                                   class="form-check-input">
                            <label for="isActive" class="form-check-label">
                                Đang kinh doanh
                            </label>
                        </div>

                        <div class="d-flex flex-wrap gap-2">
                            <button type="submit" class="btn btn-primary"
                                    th:text="${isEdit} ? 'Cập nhật' : 'Lưu biến thể'">
                                Lưu
                            </button>

                            <a th:href="@{/admin/products/{productId}/variants(productId=${product.productId})}"
                               class="btn btn-secondary">
                                Quay lại
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
