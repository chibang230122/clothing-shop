<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Thêm danh mục')}"></head>
<body>

<div th:replace="~{fragments/bootstrap-menu :: menu}"></div>

<div class="container mt-4">
    <h2>Thêm danh mục</h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/admin/categories/save}" th:object="${category}" method="post">
        <div class="mb-3">
            <label class="form-label">Tên danh mục</label>
            <input type="text" th:field="*{categoryName}" class="form-control"
                   maxlength="100" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Mô tả</label>
            <textarea th:field="*{description}" class="form-control" maxlength="500"></textarea>
        </div>

        <div class="form-check mb-3">
            <input type="checkbox" th:field="*{isActive}" class="form-check-input">
            <label class="form-check-label">Đang hoạt động</label>
        </div>

        <button type="submit" class="btn btn-primary">Lưu danh mục</button>
        <a th:href="@{/admin/categories}" class="btn btn-secondary">Quay lại</a>
    </form>
</div>

</body>
</html>
