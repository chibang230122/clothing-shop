<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Voucher - Clothing Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/admin-menu :: menu}"></div>

<div class="container-fluid px-4 py-4">
    <h3 class="fw-bold mb-3">Quản lý Mã giảm giá (Voucher)</h3>
    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm mb-4">
        <div class="card-header fw-bold bg-dark text-white">Thêm Voucher mới</div>
        <div class="card-body">
            <form th:action="@{/admin/vouchers/save}" th:object="${newVoucher}" method="post" class="row g-3">
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="col-md-2">
                    <label class="form-label fw-semibold">Mã Code *</label>
                    <input type="text" th:field="*{code}" class="form-control" placeholder="VD: SALE20" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold">Loại giảm</label>
                    <select th:field="*{discountType}" class="form-select">
                        <option value="PERCENT">Phần trăm (%)</option>
                        <option value="FIXED">Số tiền cố định (VNĐ)</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold">Giá trị giảm *</label>
                    <input type="number" step="0.01" min="1" th:field="*{discountValue}" class="form-control" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold">Đơn tối thiểu</label>
                    <input type="number" step="0.01" min="0" th:field="*{minOrderAmount}" class="form-control" value="0">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold">Giảm tối đa (nếu %)</label>
                    <input type="number" step="0.01" min="0" th:field="*{maxDiscountAmount}" class="form-control">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-semibold">Số lượng *</label>
                    <input type="number" min="1" th:field="*{quantity}" class="form-control" value="50" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Ngày bắt đầu *</label>
                    <input type="datetime-local" th:field="*{startDate}" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">Ngày kết thúc *</label>
                    <input type="datetime-local" th:field="*{endDate}" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Mô tả điều kiện</label>
                    <input type="text" th:field="*{description}" class="form-control" placeholder="VD: Giảm 10% cho đơn từ 200k">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-warning fw-bold w-100">+ Thêm Voucher</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>Mã</th>
                    <th>Mô tả</th>
                    <th>Mức giảm</th>
                    <th>Đơn tối thiểu</th>
                    <th>Còn lại</th>
                    <th>Thời hạn</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="v : ${vouchers}">
                    <td class="fw-bold text-danger" th:text="${v.code}"></td>
                    <td class="small" th:text="${v.description}"></td>
                    <td th:text="${v.discountType == 'PERCENT' ? v.discountValue.intValue() + '%' : #numbers.formatDecimal(v.discountValue,0,'COMMA',0,'POINT') + ' đ'}"></td>
                    <td th:text="${#numbers.formatDecimal(v.minOrderAmount,0,'COMMA',0,'POINT')} + ' đ'"></td>
                    <td th:text="${v.quantity}"></td>
                    <td class="small" th:text="${#temporals.format(v.startDate,'dd/MM/yyyy HH:mm')} + ' - ' + ${#temporals.format(v.endDate,'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <span th:if="${v.isActive}" class="badge bg-success">Hoạt động</span>
                        <span th:unless="${v.isActive}" class="badge bg-secondary">Ngừng</span>
                    </td>
                    <td>
                        <form th:action="@{/admin/vouchers/toggle/{id}(id=${v.voucherId})}" method="post" class="m-0">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-sm btn-outline-dark"
                                    th:text="${v.isActive ? 'Tắt' : 'Bật'}"></button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
