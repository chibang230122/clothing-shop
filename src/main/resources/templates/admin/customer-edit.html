<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Chỉnh sửa thông tin khách hàng')}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/admin-menu :: menu}"></div>

<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width:600px">
        <div class="card-body p-4">

            <h3 class="mb-4">Chỉnh sửa thông tin khách hàng</h3>

            <form th:action="@{/admin/accounts/{id}/edit(id=${customerId})}"
                  th:object="${form}" method="post">

                <div class="mb-3">
                    <label>Email đăng nhập</label>
                    <input type="email" class="form-control"
                           th:value="${customerEmail}" readonly>
                </div>

                <div class="mb-3">
                    <label for="fullName" class="form-label">Họ và tên</label>
                    <input th:field="*{fullName}" maxlength="100" autocomplete="name"
                           class="form-control" required>
                    <small th:errors="*{fullName}"
                           class="text-danger"></small>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">Số điện thoại</label>
                    <input th:field="*{phone}" type="tel" maxlength="20" autocomplete="tel"
                           class="form-control">
                    <small th:errors="*{phone}"
                           class="text-danger"></small>
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label">Địa chỉ</label>
                    <textarea th:field="*{address}" maxlength="300" autocomplete="street-address"
                              class="form-control" rows="3">
                    </textarea>
                    <small th:errors="*{address}"
                           class="text-danger"></small>
                </div>

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button type="submit" class="btn btn-dark">
                    Lưu thay đổi
                </button>

                <a th:href="@{/admin/accounts}"
                   class="btn btn-outline-secondary">
                    Quay lại
                </a>

            </form>
        </div>
    </div>
</div>

</body>
</html>
