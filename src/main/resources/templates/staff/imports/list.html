<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Lịch sử phiếu nhập')}"></head>
<body>
<div th:replace="~{fragments/bootstrap-menu :: menu}"></div>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4"><h2 class="mb-0">Lịch sử phiếu nhập kho</h2><a class="btn btn-primary" th:href="@{/staff/imports/new}">Tạo phiếu nhập</a></div>
    <div class="table-responsive"><table class="table table-bordered table-hover align-middle"><thead class="table-dark"><tr><th>Mã phiếu</th><th>Ngày nhập</th><th>Người tạo</th><th>Tổng tiền</th><th>Ghi chú</th></tr></thead><tbody>
    <tr th:each="r : ${receipts}"><td th:text="${'IMP-' + r.importReceiptId}"></td><td th:text="${#temporals.format(r.importDate,'dd/MM/yyyy HH:mm')}"></td><td th:text="${r.createdBy.fullName}"></td><td th:text="${#numbers.formatDecimal(r.totalAmount,0,'COMMA',0,'POINT') + ' đ'}"></td><td th:text="${r.note}"></td></tr>
    <tr th:if="${#lists.isEmpty(receipts)}"><td colspan="5" class="text-center">Chưa có phiếu nhập kho.</td></tr>
    </tbody></table></div>
</main>
</body></html>
