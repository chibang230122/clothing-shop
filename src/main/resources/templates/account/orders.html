<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Đơn hàng của tôi')}">
</head>
<body>

<div th:replace="~{fragments/bootstrap-menu :: menu}"></div>

<div class="container py-5">
    <h3 class="mb-4">Đơn hàng của tôi</h3>

    <div th:if="${#lists.isEmpty(orders)}"
         class="alert alert-info">
        Bạn chưa có đơn hàng nào.
    </div>

    <table th:unless="${#lists.isEmpty(orders)}"
           class="table table-bordered table-hover">
        <thead>
        <tr>
            <th>Mã đơn hàng</th>
            <th>Ngày đặt</th>
            <th>Tổng tiền</th>
            <th>Trạng thái</th>
            <th>Chi tiết</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td th:text="${order.orderCode}"></td>
            <td th:text="${order.orderDate}"></td>
            <td th:text="${order.totalAmount}"></td>
            <td th:text="${order.orderStatus}"></td>
            <td>
                <a class="btn btn-sm btn-dark"
                   th:href="@{/account/orders/{id}(id=${order.orderId})}">
                    Xem
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
