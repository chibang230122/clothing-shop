
<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Chi tiết đơn hàng')}">
</head>
<body>

<div th:replace="~{fragments/bootstrap-menu :: menu}"></div>

<div class="container py-5">

    <h3>Chi tiết đơn hàng</h3>

    <div th:if="${successMessage}" class="alert alert-success mt-3" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger mt-3" th:text="${errorMessage}"></div>

    <div class="card mt-4">
        <div class="card-body">

            <h5>Thông tin đơn hàng</h5>

            <p>Mã đơn:
                <span th:text="${order.orderCode}"></span>
            </p>

            <p>Ngày đặt:
                <span th:text="${#temporals.format(order.orderDate, 'dd/MM/yyyy HH:mm')}"></span>
            </p>

            <p>Người nhận:
                <span th:text="${order.recipientName}"></span>
            </p>

            <p>Số điện thoại:
                <span th:text="${order.recipientPhone}"></span>
            </p>

            <p>Địa chỉ:
                <span th:text="${order.shippingAddress}"></span>
            </p>

            <p>Trạng thái đơn hàng:
                <span th:text="${order.orderStatus}"></span>
            </p>

            <p>Phương thức thanh toán:
                <span th:text="${order.paymentMethod}"></span>
            </p>

            <p>Trạng thái thanh toán:
                <span th:text="${order.paymentStatus}"></span>
            </p>

            <hr>

            <h5>Sản phẩm đã đặt</h5>

            <div class="table-responsive">
                <table class="table table-bordered align-middle">

                    <thead>
                    <tr>
                        <th>Sản phẩm</th>
                        <th>Size</th>
                        <th>Màu</th>
                        <th>Đơn giá</th>
                        <th>Số lượng</th>
                        <th>Thành tiền</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="item : ${orderItems}">

                        <td th:text="${item.productVariant.product.productName}">
                        </td>

                        <td th:text="${item.productVariant.size}">
                        </td>

                        <td th:text="${item.productVariant.color}">
                        </td>

                        <td th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 0, 'POINT')}">
                        </td>

                        <td th:text="${item.quantity}">
                        </td>

                        <td th:text="${#numbers.formatDecimal(item.lineTotal, 0, 'COMMA', 0, 'POINT')}">
                        </td>

                    </tr>
                    </tbody>

                </table>
            </div>

            <hr>

            <p>Tạm tính:
                <span th:text="${#numbers.formatDecimal(order.subtotal, 0, 'COMMA', 0, 'POINT')}"></span>
            </p>

            <p>Phí vận chuyển:
                <span th:text="${#numbers.formatDecimal(order.shippingFee, 0, 'COMMA', 0, 'POINT')}"></span>
            </p>

            <h5>Tổng tiền:
                <span th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')}"></span>
            </h5>

            <p>Ghi chú:
                <span th:text="${order.note != null and !order.note.isEmpty() ? order.note : 'Không có'}"></span>
            </p>

            <form th:if="${order.orderStatus == 'PENDING'}"
                  th:action="@{/account/orders/{id}/cancel(id=${order.orderId})}"
                  method="post"
                  class="mt-3"
                  onsubmit="return confirm('Bạn có chắc chắn muốn hủy đơn hàng này không?');">

                <button type="submit" class="btn btn-danger">
                    Hủy đơn hàng
                </button>

            </form>

            <a th:href="@{/account/orders}"
               class="btn btn-outline-dark mt-3">
                Quay lại
            </a>

        </div>
    </div>

</div>

</body>
</html>
