<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Đổi mật khẩu')}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/bootstrap-menu :: menu}"></div>

<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width:500px">
        <div class="card-body p-4">

            <h3 class="mb-4">Đổi mật khẩu</h3>

            <div th:if="${param.success != null}"
                 class="alert alert-success">
                Đổi mật khẩu thành công.
            </div>

            <form th:action="@{/account/change-password}"
                  th:object="${form}" method="post">

                <div class="mb-3">
                    <label>Mật khẩu hiện tại</label>
                    <input th:field="*{currentPassword}"
                           type="password"
                           class="form-control" required>
                    <small th:errors="*{currentPassword}"
                           class="text-danger"></small>
                </div>

                <div class="mb-3">
                    <label>Mật khẩu mới</label>
                    <input th:field="*{newPassword}"
                           type="password"
                           class="form-control" required>
                    <small th:errors="*{newPassword}"
                           class="text-danger"></small>
                </div>

                <div class="mb-3">
                    <label>Nhập lại mật khẩu mới</label>
                    <input th:field="*{confirmPassword}"
                           type="password"
                           class="form-control" required>
                    <small th:errors="*{confirmPassword}"
                           class="text-danger"></small>
                </div>

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button type="submit"
                        class="btn btn-dark w-100">
                    Cập nhật mật khẩu
                </button>

                <a th:href="@{/account/profile}"
                   class="btn btn-link mt-3">
                    Quay lại hồ sơ
                </a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
