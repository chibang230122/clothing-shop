<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Hồ sơ cá nhân')}">
</head>
<body class="bg-light">

<div th:replace="~{fragments/bootstrap-menu :: menu}"></div>

<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width:600px">
        <div class="card-body p-4">

            <h3 class="mb-4">Hồ sơ cá nhân</h3>

            <div th:if="${param.success != null}"
                 class="alert alert-success">
                Cập nhật hồ sơ thành công.
            </div>

            <form th:action="@{/account/profile}"
                  th:object="${form}" method="post">

                <div class="mb-3">
                    <label>Email đăng nhập</label>
                    <input type="email" class="form-control"
                           th:value="${email}" readonly>
                </div>

                <div class="mb-3">
                    <label>Họ và tên</label>
                    <input th:field="*{fullName}"
                           class="form-control" required>
                    <small th:errors="*{fullName}"
                           class="text-danger"></small>
                </div>

                <div class="mb-3">
                    <label>Số điện thoại</label>
                    <input th:field="*{phone}"
                           class="form-control">
                    <small th:errors="*{phone}"
                           class="text-danger"></small>
                </div>

                <div class="mb-3">
                    <label>Địa chỉ</label>
                    <textarea th:field="*{address}"
                              class="form-control" rows="3">
                    </textarea>
                    <small th:errors="*{address}"
                           class="text-danger"></small>
                </div>

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button type="submit" class="btn btn-dark">
                    Lưu thay đổi
                </button>

                <a th:href="@{/account/change-password}"
                   class="btn btn-outline-secondary">
                    Đổi mật khẩu
                </a>

            </form>
        </div>
    </div>
</div>

</body>
</html>
