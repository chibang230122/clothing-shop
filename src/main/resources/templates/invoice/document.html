<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><title th:text="|Hóa đơn ${order.orderCode}|">Hóa đơn bán hàng</title>
    <style>body{font:16px system-ui,sans-serif;max-width:850px;margin:2rem auto;color:#202530}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ccc;padding:.6rem;text-align:left}tfoot th{text-align:right}@media print{body{margin:0}}</style>
</head><body>
<header><p>Clothing Shop</p><h1>Hóa đơn bán hàng</h1></header>
<p>Mã đơn <strong th:text="${order.orderCode}"></strong> · Ngày đặt <span th:text="${#temporals.format(order.orderDate,'dd/MM/yyyy HH:mm')}"></span></p>
<p>Người nhận <span th:text="${order.recipientName}"></span></p>
<p>Địa chỉ giao hàng <span th:text="${order.shippingAddress}"></span></p>
<p>Trạng thái đơn <span th:text="${order.orderStatus}"></span> · Thanh toán <span th:text="${order.paymentMethod + ' / ' + order.paymentStatus}"></span></p>
<table><caption>Chi tiết đơn hàng (VNĐ)</caption>
    <thead><tr><th>Sản phẩm</th><th>Size / Màu</th><th>Số lượng</th><th>Đơn giá</th><th>Thành tiền</th></tr></thead>
    <tbody><tr th:each="item : ${items}">
        <td th:text="${item.productVariant.product.productName}"></td>
        <td th:text="|${item.productVariant.size} / ${item.productVariant.color}|"></td>
        <td th:text="${item.quantity}"></td><td th:text="${#numbers.formatCurrency(item.unitPrice)}"></td>
        <td th:text="${#numbers.formatCurrency(item.lineTotal)}"></td></tr></tbody>
    <tfoot>
    <tr><th colspan="4">Tạm tính</th><td th:text="${#numbers.formatCurrency(order.subtotal)}"></td></tr>
    <tr><th colspan="4">Phí vận chuyển</th><td th:text="${#numbers.formatCurrency(order.shippingFee)}"></td></tr>
    <tr><th colspan="4">Tổng cộng</th><td th:text="${#numbers.formatCurrency(order.totalAmount)}"></td></tr>
    </tfoot></table></body></html>
