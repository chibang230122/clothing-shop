<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothing Shop - Thời trang</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #222;
        }

        .container-shop {
            padding: 40px 7%;
        }

        .container-shop h2 {
            margin-bottom: 25px;
            font-weight: bold;
        }

        .product-list {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 22px;
        }

        .product-link {
            display: block;
            color: inherit;
            text-decoration: none;
            border-radius: 8px;
        }

        .product-link:focus-visible {
            outline: 3px solid #0d6efd;
            outline-offset: 4px;
        }

        .product {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px #00000010;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
        }

        .product-link:hover .product {
            transform: translateY(-4px);
        }

        .product-link:hover h3 {
            color: #c0392b;
        }

        .product img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            background: #eee;
        }

        .product-img-empty {
            width: 100%;
            height: 230px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eee;
            color: #777;
        }

        .product-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-info h3 {
            font-size: 17px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .price {
            color: #c0392b;
            font-size: 18px;
            font-weight: bold;
        }

        .description {
            margin-top: 10px;
            color: #666;
            font-size: 14px;
            line-height: 1.5;
        }

        .detail-button {
            display: block;
            margin-top: 15px;
            padding: 10px;
            background: #111;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 4px;
        }

        .detail-button:hover {
            background: #444;
            color: white;
        }

        .empty {
            padding: 25px;
            background: white;
            border-radius: 6px;
            text-align: center;
            color: #666;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 22px;
            margin-top: 30px;
        }

        @media (max-width: 900px) {
            .product-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 550px) {
            .product-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div th:replace="~{fragments/bootstrap-menu :: menu}"></div>

<div id="homeBannerCarousel" class="carousel slide position-relative" data-bs-ride="carousel" data-bs-interval="3000">
    <div class="carousel-indicators">
        <button type="button" data-bs-target="#homeBannerCarousel" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#homeBannerCarousel" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#homeBannerCarousel" data-bs-slide-to="2"></button>
    </div>

    <div class="position-absolute top-0 start-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center text-center text-white px-3"
         style="z-index: 2; pointer-events: none;">
        <h2 class="fw-bold display-5">Phong cách của riêng bạn</h2>
        <p class="fs-5 mb-4">Khám phá những mẫu thời trang phù hợp với cá tính của bạn.</p>
        <a th:href="@{/products}" class="btn btn-light fw-bold px-4 py-2" style="pointer-events: auto;">
            Khám phá ngay
        </a>
    </div>

    <div class="carousel-inner">
        <div class="carousel-item active">
            <img th:src="@{/images/banner-1.jpg}" class="d-block w-100"
                 style="height: 430px; object-fit: cover; filter: brightness(65%);" alt="Banner 1">
        </div>
        <div class="carousel-item">
            <img th:src="@{/images/banner-2.jpg}" class="d-block w-100"
                 style="height: 430px; object-fit: cover; filter: brightness(65%);" alt="Banner 2">
        </div>
        <div class="carousel-item">
            <img th:src="@{/images/banner-3.jpg}" class="d-block w-100"
                 style="height: 430px; object-fit: cover; filter: brightness(65%);" alt="Banner 3">
        </div>
    </div>

    <button class="carousel-control-prev" type="button" data-bs-target="#homeBannerCarousel" data-bs-slide="prev" style="z-index: 3;">
        <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#homeBannerCarousel" data-bs-slide="next" style="z-index: 3;">
        <span class="carousel-control-next-icon"></span>
    </button>
</div>

<main class="container-shop" id="products">
    <h2>Sản phẩm nổi bật</h2>

    <div class="product-list"
         th:if="${products != null and !#lists.isEmpty(products)}">

        <a class="product-link" th:each="product : ${products}"
           th:href="@{/products/{id}(id=${product.productId})}">
        <article class="product">

            <img th:if="${product.imageUrl != null and !#strings.isEmpty(product.imageUrl)}"
                 th:src="@{${product.imageUrl}}"
                 th:alt="${product.productName}">

            <div class="product-img-empty"
                 th:unless="${product.imageUrl != null and !#strings.isEmpty(product.imageUrl)}">
                Chưa có hình ảnh
            </div>

            <div class="product-info">
                <h3 th:text="${product.productName}">Tên sản phẩm</h3>

                <p class="price"
                   th:text="${#numbers.formatDecimal(product.basePrice, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                    150.000 đ
                </p>

                <p class="description"
                   th:if="${product.description != null and !#strings.isEmpty(product.description)}"
                   th:text="${product.description}">
                    Mô tả sản phẩm
                </p>

            </div>

        </article>
        </a>
    </div>

    <p class="empty"
       th:if="${products == null or #lists.isEmpty(products)}">
        Hiện chưa có sản phẩm nào để hiển thị.
    </p>

    <div style="text-align: center; margin-top: 30px;">
        <a th:href="@{/products}" class="detail-button"
           style="display: inline-block; padding: 12px 25px;">
            Xem tất cả sản phẩm
        </a>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
