<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<body>

<header th:fragment="menu">
    <h1>CLOTHING SHOP</h1>

    <nav>
        <a th:href="@{/}">Trang chủ</a>
        <a th:href="@{/products}">Sản phẩm</a>
        <a href="#footer">Liên hệ</a>

        <a sec:authorize="isAnonymous()"
           th:href="@{/login}">Đăng nhập</a>

        <a sec:authorize="isAnonymous()"
           th:href="@{/register}">Đăng ký</a>

        <a sec:authorize="isAuthenticated()"
           th:href="@{/account/profile}">Hồ sơ</a>

        <a sec:authorize="isAuthenticated()"
           th:href="@{/account/change-password}">Đổi mật khẩu</a>

        <a sec:authorize="hasRole('CUSTOMER')"
           th:href="@{/account/orders}">Đơn hàng</a>

        <a sec:authorize="hasRole('ADMIN')"
           th:href="@{/admin}">Quản trị</a>

        <form sec:authorize="isAuthenticated()"
              th:action="@{/logout}" method="post"
              style="display:inline">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button class="home-logout" type="submit">Đăng xuất</button>
        </form>
    </nav>
</header>

</body>
</html>
