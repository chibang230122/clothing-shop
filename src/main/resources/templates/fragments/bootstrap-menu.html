<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<body>

<nav th:fragment="menu"
     class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-bold" th:href="@{/}">CLOTHING SHOP</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarMenu"
                aria-controls="navbarMenu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">

                <li class="nav-item">
                    <a class="nav-link px-3"
                       th:classappend="${currentPath == '/'} ? 'active bg-warning text-dark fw-bold rounded' : ''"
                       th:href="@{/}">Trang chủ</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link px-3"
                       th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/products')} ? 'active bg-warning text-dark fw-bold rounded' : ''"
                       th:href="@{/products}">Sản phẩm</a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('CUSTOMER')">
                    <a class="nav-link px-3"
                       th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/cart')} ? 'active bg-warning text-dark fw-bold rounded' : ''"
                       th:href="@{/cart}">Giỏ hàng</a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('CUSTOMER')">
                    <a class="nav-link px-3"
                       th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/account/orders')} ? 'active bg-warning text-dark fw-bold rounded' : ''"
                       th:href="@{/account/orders}">Đơn hàng của tôi</a>
                </li>

                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','STAFF')">
                    <a class="nav-link px-3"
                       th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/staff/dashboard')} ? 'active bg-warning text-dark fw-bold rounded' : ''"
                       th:href="@{/staff/dashboard}">Dashboard Staff</a>
                </li>

                <!-- STAFF và ADMIN vào Quản lý đơn hàng -->
                <li class="nav-item" sec:authorize="hasAnyRole('ADMIN','STAFF')">
                    <a class="nav-link px-3"
                       th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/staff/orders')} ? 'active bg-warning text-dark fw-bold rounded' : ''"
                       th:href="@{/staff/orders}">Quản lý đơn hàng</a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link px-3"
                       th:classappend="${currentPath != null and #strings.startsWith(currentPath, '/admin')} ? 'active bg-warning text-dark fw-bold rounded' : ''"
                       th:href="@{/admin}">Quản trị</a>
                </li>

                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <th:block th:replace="~{fragments/account-controls :: identity('nav-link px-3 text-info fw-semibold')}"></th:block>
                </li>

                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link px-3"
                       th:classappend="${currentPath == '/account/change-password'} ? 'active bg-warning text-dark fw-bold rounded' : ''"
                       th:href="@{/account/change-password}">Đổi mật khẩu</a>
                </li>

                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link px-3"
                       th:classappend="${currentPath == '/login'} ? 'active bg-warning text-dark fw-bold rounded' : ''"
                       th:href="@{/login}">Đăng nhập</a>
                </li>

                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link px-3"
                       th:classappend="${currentPath == '/register'} ? 'active bg-warning text-dark fw-bold rounded' : ''"
                       th:href="@{/register}">Đăng ký</a>
                </li>

                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="ms-lg-2 m-0">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-outline-light btn-sm" type="submit">Đăng xuất</button>
                    </form>
                </li>

            </ul>
        </div>
    </div>
</nav>

</body>
</html>
