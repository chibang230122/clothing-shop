<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Mua ngay')}"></head>
<style>
    .checkout-compact { max-width: 820px; }
    .checkout-compact h2 { font-size: 1.55rem; }
    .checkout-compact .card { border-radius: .75rem; }
    .checkout-compact .card-body { padding: 1.15rem 1.35rem; }
    .checkout-compact .form-control, .checkout-compact .form-select {
        min-height: 39px; padding: .45rem .7rem; font-size: .95rem;
    }
    .checkout-compact textarea.form-control { min-height: 68px; }
    .checkout-compact .mb-3 { margin-bottom: .8rem !important; }
    .voucher-summary { list-style: none; cursor: pointer; }
    .voucher-summary::-webkit-details-marker { display: none; }
    .voucher-item-disabled {
        background-color: #e9ecef !important;
        color: #6c757d !important;
        filter: grayscale(100%);
        opacity: 0.72;
        cursor: not-allowed;
        user-select: none;
    }
    @media (max-width: 576px) {
        .checkout-compact .card-body { padding: 1rem; }
    }
</style>
<body>
<div th:replace="~{fragments/bootstrap-menu :: menu}"></div>
<main class="container checkout-compact py-4"
      th:with="orderAmt=${totalAmount != null ? totalAmount.doubleValue() : 0.0},
               vResult=${voucherService.evaluate(appliedVoucherCode, totalAmount)}">

    <h2 class="mb-4">Mua ngay</h2>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <!-- Khung thông tin sản phẩm & Chọn Voucher -->
    <div class="card mb-3">
        <div class="card-body">
            <h5 th:text="${variant.product.productName}"></h5>
            <p class="mb-1">Size: <span th:text="${variant.size}"></span> | Màu: <span th:text="${variant.color}"></span></p>
            <p class="mb-2">Số lượng: <span th:text="${quantity}"></span></p>

            <!-- Khu vực chọn / nhập Voucher (Thuần HTML/Thymeleaf, không dùng script) -->
            <div class="border-top border-bottom py-3 my-2">
                <details class="mb-2">
                    <summary class="d-flex justify-content-between align-items-center voucher-summary">
                        <span class="fw-semibold small">Mã giảm giá (Voucher)</span>
                        <span class="btn btn-outline-warning text-dark btn-sm py-0 px-2 fw-semibold">
                            Chọn mã giảm giá ▾
                        </span>
                    </summary>

                    <!-- Danh sách Voucher sổ xuống -->
                    <div class="border rounded p-2 mt-2 bg-light" style="max-height: 230px; overflow-y: auto;">
                        <div th:if="${shopVouchers == null or #lists.isEmpty(shopVouchers)}"
                             class="text-muted small text-center py-2">
                            Hiện không có mã giảm giá nào khả dụng.
                        </div>

                        <div th:each="v : ${shopVouchers}"
                             th:with="minAmt=${v.minOrderAmount != null ? v.minOrderAmount.doubleValue() : 0.0},
                                      eligible=${orderAmt >= minAmt}">

                            <!-- 1. MÃ ÁP DỤNG ĐƯỢC: Hiện màu nổi bật + Nút Áp dụng -->
                            <div th:if="${eligible}"
                                 class="d-flex justify-content-between align-items-center bg-white border border-warning rounded p-2 mb-2 shadow-sm">
                                <div class="pe-2">
                                    <div>
                                        <span class="badge bg-danger me-1" th:text="${v.code}">CODE</span>
                                        <span class="fw-bold small text-dark"
                                              th:text="${v.discountType == 'PERCENT'
                                                  ? 'Giảm ' + v.discountValue.intValue() + '%' + (v.maxDiscountAmount != null ? ' (tối đa ' + #numbers.formatDecimal(v.maxDiscountAmount,0,'COMMA',0,'POINT') + ' đ)' : '')
                                                  : 'Giảm ' + #numbers.formatDecimal(v.discountValue,0,'COMMA',0,'POINT') + ' đ'}">
                                        </span>
                                    </div>
                                    <div class="text-muted" style="font-size: 12px;"
                                         th:text="'Áp dụng cho đơn từ ' + ${#numbers.formatDecimal(minAmt,0,'COMMA',0,'POINT')} + ' đ'">
                                    </div>
                                </div>
                                <a th:href="@{/checkout/buy-now/{id}(id=${variant.variantId}, quantity=${quantity}, voucherCode=${v.code})}"
                                   class="btn btn-danger btn-sm fw-semibold flex-shrink-0">
                                    Áp dụng
                                </a>
                            </div>

                            <!-- 2. MÃ KHÔNG ÁP DỤNG ĐƯỢC: Làm xám đi + Khóa không cho chọn -->
                            <div th:unless="${eligible}"
                                 class="d-flex justify-content-between align-items-center border rounded p-2 mb-2 voucher-item-disabled">
                                <div class="pe-2">
                                    <div>
                                        <span class="badge bg-secondary me-1" th:text="${v.code}">CODE</span>
                                        <span class="fw-semibold small"
                                              th:text="${v.discountType == 'PERCENT'
                                                  ? 'Giảm ' + v.discountValue.intValue() + '%'
                                                  : 'Giảm ' + #numbers.formatDecimal(v.discountValue,0,'COMMA',0,'POINT') + ' đ'}">
                                        </span>
                                    </div>
                                    <div style="font-size: 12px;"
                                         th:text="'Mua thêm ' + ${#numbers.formatDecimal(minAmt - orderAmt,0,'COMMA',0,'POINT')} + ' đ để áp dụng'">
                                    </div>
                                </div>
                                <button type="button" class="btn btn-secondary btn-sm flex-shrink-0" disabled>
                                    Không đủ ĐK
                                </button>
                            </div>
                        </div>
                    </div>
                </details>

                <!-- Form nhập mã thủ công -->
                <form th:action="@{/checkout/buy-now/{id}(id=${variant.variantId})}" method="get" class="input-group input-group-sm">
                    <input type="hidden" name="quantity" th:value="${quantity}">
                    <input type="text" name="voucherCode" class="form-control text-uppercase"
                           th:value="${appliedVoucherCode}" placeholder="Hoặc nhập mã giảm giá...">
                    <button type="submit" class="btn btn-dark">Áp dụng</button>
                </form>

                <!-- Thông báo kết quả áp dụng -->
                <div th:if="${vResult != null}"
                     class="small mt-1"
                     th:classappend="${vResult.valid ? 'text-success fw-semibold' : 'text-danger'}">
                    <span th:text="${vResult.message}"></span>
                    <a th:if="${vResult.valid}"
                       th:href="@{/checkout/buy-now/{id}(id=${variant.variantId}, quantity=${quantity})}"
                       class="text-danger ms-2 text-decoration-none fw-normal">Bỏ chọn</a>
                </div>

                <!-- Hiển thị số tiền được giảm -->
                <div th:if="${vResult != null and vResult.valid}"
                     class="d-flex justify-content-between text-success small fw-semibold mt-2">
                    <span>Giảm giá voucher (<span th:text="${vResult.code}"></span>):</span>
                    <span th:text="'-' + ${#numbers.formatDecimal(vResult.discountAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
                </div>
            </div>

            <p class="fw-bold text-danger mb-0 mt-2">Tổng tiền:
                <span th:text="${#numbers.formatDecimal(vResult != null and vResult.valid ? vResult.finalTotal : totalAmount, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span>
            </p>
        </div>
    </div>

    <!-- Form thông tin đặt hàng -->
    <form th:action="@{/checkout/buy-now/{id}(id=${variant.variantId})}" method="post" th:object="${checkoutForm}" class="card">
        <input type="hidden" name="quantity" th:value="${quantity}">
        <input type="hidden" name="voucherCode" th:value="${vResult != null and vResult.valid ? vResult.code : ''}">

        <div class="card-body">
            <div class="mb-3">
                <label class="form-label">Tên người nhận</label>
                <input class="form-control" th:field="*{recipientName}" required maxlength="100">
                <small class="text-danger" th:errors="*{recipientName}"></small>
            </div>
            <div class="mb-3">
                <label class="form-label">Số điện thoại</label>
                <input class="form-control" th:field="*{recipientPhone}" required>
                <small class="text-danger" th:errors="*{recipientPhone}"></small>
            </div>
            <div class="mb-3">
                <label class="form-label">Địa chỉ giao hàng</label>
                <textarea class="form-control" rows="2" th:field="*{shippingAddress}" required maxlength="300"></textarea>
                <small class="text-danger" th:errors="*{shippingAddress}"></small>
            </div>
            <div class="mb-3">
                <label class="form-label">Phương thức thanh toán</label>
                <select class="form-select" th:field="*{paymentMethod}">
                    <option value="COD">Thanh toán khi nhận hàng (COD)</option>
                    <option value="BANK_TRANSFER">Chuyển khoản</option>
                </select>
                <div class="form-text">Chọn chuyển khoản ngân hàng để xem mã QR ở trang chi tiết đơn hàng.</div>
            </div>
            <div class="mb-3">
                <label class="form-label">Ghi chú</label>
                <textarea class="form-control" rows="2" th:field="*{note}" maxlength="500"></textarea>
            </div>
            <button type="submit" class="btn btn-danger">Đặt mua ngay</button>
            <a th:href="@{/products/{id}(id=${variant.product.productId})}" class="btn btn-outline-secondary">Quay lại sản phẩm</a>
        </div>
    </form>
</main>
</body>
</html>
