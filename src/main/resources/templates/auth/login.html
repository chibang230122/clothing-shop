<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Đăng nhập')}">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width:440px">
        <div class="card-body p-4">

            <h3 class="text-center mb-4">Đăng nhập</h3>

            <div th:if="${param.error != null}"
                 class="alert alert-danger">
                Email hoặc mật khẩu không chính xác.
            </div>

            <div th:if="${param.locked != null}"
                 class="alert alert-warning">
                Tài khoản đã bị vô hiệu hóa.
                Vui lòng liên hệ quản trị viên.
            </div>

            <div th:if="${param.logout != null}"
                 class="alert alert-success">
                Đã đăng xuất thành công.
            </div>

            <div th:if="${param.registered != null}"
                 class="alert alert-success">
                Đăng ký thành công. Hãy đăng nhập.
            </div>

            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email"
                           class="form-control"
                           autocomplete="username"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" name="password"
                           class="form-control"
                           autocomplete="current-password"
                           required>
                </div>

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <button type="submit"
                        class="btn btn-dark w-100">
                    Đăng nhập
                </button>
            </form>

            <p class="text-center mt-3 mb-0">
                Chưa có tài khoản?
                <a th:href="@{/register}">Đăng ký ngay</a>
            </p>

            <a th:href="@{/}" class="btn btn-outline-secondary w-100 mt-3">
                ← Quay lại cửa hàng
            </a>
        </div>
    </div>
</div>

</body>
</html>
