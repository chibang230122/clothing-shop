<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Đặt lại mật khẩu')}"></head>
<body class="bg-light">
<main class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width:480px">
        <div class="card-body p-4">
            <h1 class="h3 mb-3">Đặt lại mật khẩu</h1>
            <p>Nếu <strong th:text="${resetEmail}">email</strong> thuộc tài khoản đang hoạt động,
                bạn sẽ nhận được mã OTP có hiệu lực trong 10 phút.</p>
            <p th:if="${error != null}" th:text="${error}" class="alert alert-danger" role="alert"></p>

            <form th:action="@{/reset-password}" method="post">
                <div class="mb-3">
                    <label for="otp" class="form-label">Mã OTP</label>
                    <input id="otp" name="otp" type="text" class="form-control" required
                           pattern="[0-9]{6}" minlength="6" maxlength="6"
                           inputmode="numeric" autocomplete="one-time-code">
                </div>
                <div class="mb-3">
                    <label for="newPassword" class="form-label">Mật khẩu mới</label>
                    <div class="input-group">
                        <input th:attr="data-password-rule=${passwordRule}"
                               id="newPassword" name="newPassword" type="password" class="form-control"
                               minlength="8" autocomplete="new-password" required>
                        <button th:replace="~{fragments/account-controls :: passwordToggle('newPassword')}"></button>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Xác nhận mật khẩu mới</label>
                    <div class="input-group">
                        <input id="confirmPassword" name="confirmPassword" type="password" class="form-control"
                               minlength="8" autocomplete="new-password" required>
                        <button th:replace="~{fragments/account-controls :: passwordToggle('confirmPassword')}"></button>
                    </div>
                </div>
                <button type="submit" class="btn btn-dark w-100">Đặt lại mật khẩu</button>
            </form>

            <form th:action="@{/forgot-password}" method="post" class="mt-3">
                <input type="hidden" name="email" th:value="${resetEmail}">
                <button type="submit" class="btn btn-link p-0">Gửi lại OTP</button>
                <small class="text-muted d-block">Chờ ít nhất 60 giây giữa hai lần gửi.</small>
            </form>
            <a th:href="@{/forgot-password}" class="btn btn-link px-0 mt-2">Nhập email khác</a>
            <a th:href="@{/login}" class="btn btn-outline-secondary w-100 mt-2">Quay lại đăng nhập</a>
        </div>
    </div>
</main>
</body>
</html>
