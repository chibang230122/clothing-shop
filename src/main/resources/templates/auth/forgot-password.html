<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: header('Quên mật khẩu')}"></head>
<body class="bg-light">
<main class="container py-5">
    <div class="card shadow-sm mx-auto" style="max-width:480px">
        <div class="card-body p-4">
            <h1 class="h3 mb-3">Quên mật khẩu</h1>
            <p th:unless="${mailAvailable}" class="alert alert-warning" role="status">
                Dịch vụ gửi OTP đang tạm ngưng. Vui lòng liên hệ quản trị viên.
            </p>
            <p th:if="${error != null}" th:text="${error}" class="alert alert-danger" role="alert"></p>

            <form th:if="${mailAvailable}" th:action="@{/forgot-password}" method="post">
                <label for="email" class="form-label">Email đăng nhập</label>
                <input id="email" name="email" type="email" class="form-control mb-3"
                       maxlength="150" autocomplete="email" required>
                <button type="submit" class="btn btn-dark w-100">Gửi mã OTP</button>
            </form>

            <a th:href="@{/login}" class="btn btn-link px-0 mt-3">Quay lại đăng nhập</a>
        </div>
    </div>
</main>
</body>
</html>
