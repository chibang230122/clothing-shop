spring.application.name=clothing-shop

# Ket noi SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ClothingShopDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=java_app
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cau hinh JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8081
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#cau hinh chuc nang tao tai khoan admin
app.admin.seed.enabled=true
APP_ADMIN_EMAIL=admin@clothingshop.local
APP_ADMIN_PASSWORD=AdminShop123@

# ===== Socket Server (thanh vien 5) - xem docs/SOCKET_PROTOCOL.md =====
shop.socket.enabled=true
shop.socket.port=9099
# 127.0.0.1 = chi may nay. Muon may khac trong LAN ket noi: dat bien moi truong SHOP_SOCKET_BIND_ADDRESS=0.0.0.0
shop.socket.bind-address=${SHOP_SOCKET_BIND_ADDRESS:127.0.0.1}
shop.socket.max-clients=20
shop.socket.idle-timeout-ms=60000
shop.socket.max-line-length=512
# De trong = khong yeu cau AUTH. Dat qua bien moi truong SHOP_SOCKET_AUTH_TOKEN, KHONG ghi gia tri that vao file nay
shop.socket.auth-token=${SHOP_SOCKET_AUTH_TOKEN:}

# Ghi log ra file de lam minh chung (thu muc logs/ da nam trong .gitignore)
logging.file.name=logs/clothing-shop.log

app.demo-password-reset.enabled=false

# Khoi phuc mat khau bang SMTP. Neu khong khai bao may chu va dia chi gui, form bao tam ngung.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.password-reset.from=${SMTP_FROM:${SMTP_USERNAME:}}

